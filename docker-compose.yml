services:
  postgresql:
    image: postgres:16
    container_name: baseplataformaentregas
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redisplataformaentregas
    ports:
        - '6379:6379'
    volumes:
        - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped

volumes:
  dados_postgres:
  redis-data:
      driver: local